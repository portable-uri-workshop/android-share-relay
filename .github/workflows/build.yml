name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install exact Android toolchain
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Build unsigned release with strict verification
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --dependency-verification=strict assembleRelease
      - name: Verify manifest, permissions, and logging invariants
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          PERMISSIONS="$($ANDROID_HOME/build-tools/36.1.0/aapt2 dump permissions "$APK")"
          printf '%s\n' "$PERMISSIONS"
          if printf '%s\n' "$PERMISSIONS" | grep -q 'uses-permission'; then
            echo 'Unexpected Android permission in APK' >&2
            exit 1
          fi
          MANIFEST="$($ANDROID_HOME/build-tools/36.1.0/aapt2 dump xmltree "$APK" --file AndroidManifest.xml)"
          printf '%s\n' "$MANIFEST"
          printf '%s\n' "$MANIFEST" | grep -q 'android.intent.action.VIEW'
          printf '%s\n' "$MANIFEST" | grep -q 'kakaolink'
          printf '%s\n' "$MANIFEST" | grep -q 'send'
          printf '%s\n' "$MANIFEST" | grep -q 'android:noHistory'
          printf '%s\n' "$MANIFEST" | grep -q 'android:taskAffinity'
          grep -q 'android:theme="@android:style/Theme.NoDisplay"' app/src/main/AndroidManifest.xml
          if grep -R -n -E 'android/util/Log|__android_log' app/src; then
            echo 'Forbidden logging API found' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: share-uri-bridge-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
