name: Build, sign, attest, and release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install exact Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Build unsigned APK from tagged source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --dependency-verification=strict clean assembleRelease
      - name: Verify unsigned APK privacy invariants
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          PERMISSIONS="$($ANDROID_HOME/build-tools/36.1.0/aapt2 dump permissions "$APK")"
          if printf '%s\n' "$PERMISSIONS" | grep -q 'uses-permission'; then
            echo 'Unexpected Android permission in release APK' >&2
            exit 1
          fi
          if grep -R -n -E 'android/util/Log|__android_log' app/src; then
            echo 'Forbidden logging API found' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  sign-attest:
    needs: build-test
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install exact signing tools
        run: sdkmanager "build-tools;36.1.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-apk
          path: unsigned
      - name: Restore signing key and sign exact unsigned artifact
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -f -p 4 \
            unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "dist/ShareUriBridge-${GITHUB_REF_NAME}.apk" \
            "$RUNNER_TEMP/aligned.apk"
          rm -f "$KEYSTORE" "$RUNNER_TEMP/aligned.apk"
      - name: Verify certificate, manifest, and checksum
        run: |
          APK="dist/ShareUriBridge-${GITHUB_REF_NAME}.apk"
          VERIFY_OUTPUT="$($ANDROID_HOME/build-tools/36.1.0/apksigner verify --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY_OUTPUT"
          ACTUAL_CERT="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="$(tr -d '\r\n ' < release/expected-certificate-sha256.txt | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          PERMISSIONS="$($ANDROID_HOME/build-tools/36.1.0/aapt2 dump permissions "$APK")"
          if printf '%s\n' "$PERMISSIONS" | grep -q 'uses-permission'; then
            echo 'Unexpected Android permission in signed APK' >&2
            exit 1
          fi
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/ShareUriBridge-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: dist
          if-no-files-found: error

  release:
    needs: sign-attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: dist
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Version 2 changes the default clipboard output to the original KakaoLink data URI.

          - Add launcher settings for opt-in GitHub Pages Link mode and sensitive clipboard metadata.
          - Validate VIEW action, kakaolink scheme, send host, and a 32,768-character limit.
          - Target Android 16 and enforce intent-filter matching for explicit Intents.
          - Keep the existing package name and signing certificate for in-place updates.
          - Build, sign, attest, and release on separate GitHub-hosted runners.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Share URI Bridge $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
